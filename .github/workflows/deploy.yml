name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A run already in flight finishes; only the newest queued one survives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A project site is served from /<repo>/, but a user site
      # (<owner>.github.io) is served from the domain root.
      - name: Work out the base path
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          # Pages paths keep the repository's capitalisation — /MapLog/, not
          # /maplog/ — so only the user-site test is case-folded.
          lower_repo=$(echo "$repo" | tr '[:upper:]' '[:lower:]')
          lower_owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "$lower_repo" = "$lower_owner.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi
          echo "Building for base: $(grep path "$GITHUB_OUTPUT" | tail -1)"

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on with the Actions source, so no manual setup step.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
